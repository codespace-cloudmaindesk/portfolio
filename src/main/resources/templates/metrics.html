<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metrics | Portfolio</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/base.css}" />
    <link rel="stylesheet" th:href="@{/css/layout.css}" />
    <link rel="stylesheet" th:href="@{/css/components.css}" />
    <link rel="stylesheet" th:href="@{/css/pages/home.css}" />
</head>
<body>

<div th:replace="~{fragments :: nav}"></div>

<main>
<div class="container section">
    <h2 class="section-heading">Metrics</h2>
    <dl class="kpi-grid home-metrics" th:if="${metrics != null and !metrics.isEmpty()}">
        <div class="home-metric" th:each="mtr : ${metrics}">
            <dt th:text="${mtr.label}">Label</dt>
            <dd>
                <span class="js-count" th:data-target="${mtr.target}">0</span><span class="home-metric-suffix" th:text="${mtr.suffix}"></span>
            </dd>
        </div>
    </dl>
</div>
</main>

<div th:replace="~{fragments :: footer}"></div>

<script th:src="@{/js/pages/counter.js}"></script>
</body>
</html>
