<footer th:fragment="footer" class="site-footer">
    <div class="container footer-grid">
        <div>
            <div class="logo">Tumiso<span class="logo-span">.</span></div>
            <p class="footer-tagline">Turning Business Challenges into Technology Solutions.</p>
        </div>
        <div>
            <h4 class="footer-heading">Connect</h4>
            <ul class="footer-social">
                <li th:each="link : ${socialLinks}">
                    <a th:href="${link.url}" th:title="${link.label}">
                        <i th:class="'ti ' + ${link.icon}"></i>
                    </a>
                </li>
            </ul>
        </div>
    </div>
    <div class="container footer-bottom">
        <p class="footer-copy">&copy; 2026 Tumiso Dinkoanyane</p>
        <a href="#" class="back-to-top visible" aria-label="Back to top" title="Back to top">
            <i class="ti ti-arrow-up"></i>
        </a>
    </div>
</footer>
