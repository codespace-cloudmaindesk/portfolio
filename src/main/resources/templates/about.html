<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About | Tumiso Dinkoanyane</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/base.css}" />
    <link rel="stylesheet" th:href="@{/css/layout.css}" />
    <link rel="stylesheet" th:href="@{/css/components.css}" />
    <link rel="stylesheet" th:href="@{/css/pages/about.css}" />
</head>
<body>

    <div th:replace="~{fragments :: nav}"></div>

    <main>
        <!-- About -->
        <section class="container section about-row" aria-labelledby="about-title">
            <div class="about-text">
                <h2 id="about-title" class="about-heading" th:text="${about.title}"></h2>
                <p th:each="paragraph : ${about.description}" th:text="${paragraph}"></p>
            </div>

            <div class="about-image-column">
                <div class="about-image">
                    <img th:src="@{/images/under_01.jpg}" alt="Tumiso Dinkoanyane" class="about-img">
                </div>
            </div>
        </section>

        <!-- Core Skills -->
        <section class="container section about-row about-row--reverse" aria-labelledby="core-skills-title">
            <div class="about-image-column">
                <div class="about-image">
                    <img th:src="@{/images/under_02.jpg}" alt="Tumiso Dinkoanyane" class="about-img">
                </div>
            </div>

            <div class="about-text">
                <h2 id="core-skills-title" class="about-heading">Core Skills</h2>
                <ul id="skills-list" class="skills-list">
                    <li th:each="skill : ${skills}">
                        <span class="skill-title" th:text="${skill.name}"></span>
                        <div class="skill-progress" role="progressbar"
                             th:attr="aria-valuenow=${skill.level}, aria-valuemax=100"
                             th:aria-label="${skill.name}">
                            <span class="skill-pct" th:attr="data-target=${skill.level}" th:text="${skill.level} + '%'"></span>
                            <div class="skill-progress-fill" th:attr="data-width=${skill.level} + '%'"></div>
                        </div>
                    </li>
                </ul>
                <a class="about-skills-link" th:href="@{/skills}">View all skills <i class="ti ti-arrow-up-right"></i></a>
            </div>
        </section>
    </main>

    <div th:replace="~{fragments :: footer}"></div>

    <script th:src="@{/js/app.js}"></script>
    <script th:src="@{/js/pages/skills-progress.js}"></script>

</body>
</html>
