<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Development | Portfolio</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/base.css}" />
    <link rel="stylesheet" th:href="@{/css/layout.css}" />
    <link rel="stylesheet" th:href="@{/css/components.css}" />
</head>
<body>

<div th:replace="~{fragments :: nav}"></div>

<main>
<div class="container section">
    <h2 class="section-heading">Professional Development</h2>
    <div class="card-grid">
        <div class="card" th:each="prof : ${professionalDevelopment}">
            <h3 class="card-title" th:text="${prof.program}"></h3>
            <p class="card-description" th:text="'Provider: ' + ${prof.provider}"></p>
            <p class="card-description" th:text="'Duration: ' + ${prof.duration}"></p>
            <p class="card-description" th:text="'Status: ' + ${prof.status}"></p>
            <h4 class="card-title">Value</h4>
            <ul class="card-description">
                <li th:each="v : ${prof.value}" th:text="${v}"></li>
            </ul>
            <h4 class="card-title">Impact</h4>
            <ul class="card-description">
                <li th:each="i : ${prof.impact}" th:text="${i}"></li>
            </ul>
        </div>
    </div>
</div>
</main>

<div th:replace="~{fragments :: footer}"></div>

</body>
</html>
