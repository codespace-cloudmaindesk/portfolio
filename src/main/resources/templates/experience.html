<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experience | Portfolio</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/base.css}" />
    <link rel="stylesheet" th:href="@{/css/layout.css}" />
    <link rel="stylesheet" th:href="@{/css/components.css}" />
</head>
<body>

<div th:replace="~{fragments :: nav}"></div>

<main>
<div class="container section">
    <h2 class="section-heading">Professional Experience</h2>
    <div class="card-grid">
        <div class="card" th:each="exp : ${experience}">
            <h3 class="card-title" th:text="${exp.role}"></h3>
            <p class="card-description" th:text="${exp.company}"></p>
            <p class="card-description" th:text="${exp.period}"></p>
            <p class="card-description" th:text="${exp.location}"></p>
            <p class="card-description" th:text="${exp.type}"></p>
            <p class="card-description" th:text="${exp.description}"></p>
            <ul class="card-description">
                <li th:each="responsibility : ${exp.responsibilities}" th:text="${responsibility}"></li>
            </ul>
        </div>
    </div>
</div>
</main>

<div th:replace="~{fragments :: footer}"></div>

</body>
</html>
