<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tumiso Dinkoanyane — Data Engineer, BI Developer, and Business Analyst. Bridging business needs with technical solutions.">
    <title>Home | Tumiso Dinkoanyane</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/base.css}" />
    <link rel="stylesheet" th:href="@{/css/layout.css}" />
    <link rel="stylesheet" th:href="@{/css/components.css}" />
    <link rel="stylesheet" th:href="@{/css/pages/hero.css}" />
</head>
<body>

<div th:replace="~{fragments :: nav}"></div>

<main>

    <!-- HERO -->
    <section class="container section hero" aria-label="Hero">
        <div class="split-grid">

            <div class="hero-content">
                <p class="hero-eyebrow"><span class="eyebrow-dash"></span> Hi, I'm</p>
                <h1 class="hero-name">Tumiso<br>Dinkoanyane</h1>
                <p class="hero-role" id="hero-role" th:attr="data-roles=${#strings.listJoin(roles, roleSeparator)}"></p>
                <p class="hero-bio" th:text="${about.overview[0]}"></p>
                <div class="hero-actions">
                    <a class="btn btn-primary" th:href="@{/projects}" id="btn-view-portfolio">View Portfolio</a>
                    <a class="btn btn-secondary" th:href="@{/contact}" id="btn-contact-me">Contact Me</a>
                </div>
            </div>

            <div class="hero-visual" role="presentation" aria-hidden="true">
                <div class="hero-circle hero-circle-bg"></div>
                <div class="hero-circle hero-circle-top"><i class="ti ti-users"></i></div>
                <div class="hero-circle hero-circle-left"><i class="ti ti-chart-bar"></i></div>
                <div class="hero-circle hero-circle-right"><i class="ti ti-topology-star-3"></i></div>
                <img class="hero-photo" th:src="@{/images/hero_profile.png}" alt="Tumiso Dinkoanyane — profile photo" />
            </div>

        </div>
    </section>

    <!-- WHAT I WORK WITH -->
    <section class="container section tech-strip" aria-label="Tools and Capabilities">
        <h2 class="section-heading">What I Work With</h2>
        <ul class="tech-tag-list">
            <li class="tech-tag" th:each="skill : ${skills}" th:text="${skill.name}"></li>
        </ul>
    </section>

<div th:replace="~{fragments :: footer}"></div>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/pages/constants.js}"></script>
<script th:src="@{/js/pages/typewriter.js}"></script>

</body>
</html>
